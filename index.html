<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#090812" />
    <meta name="description" content="Vice Bay Nights — Open-world 3D urban action sandbox for desktop, every gamepad controller, and mobile touch." />
    <title>Vice Bay Nights</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preload" href="./fonts/ManusCC0-Bold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="./fonts/ManusCC0-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @keyframes vbnBootSweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(220%); } }
      @keyframes vbnBootPulse { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.45; } }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"><div style="position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#070910;color:#fff;font-family:system-ui,sans-serif;letter-spacing:.18em"><img src="./favicon.svg" width="48" height="48" alt="" style="margin:0 auto 18px;animation:vbnBootPulse 1.4s ease-in-out infinite"><strong style="font-size:clamp(24px,4vw,44px);font-style:italic;color:#ff4b9d">VICE BAY NIGHTS</strong><span style="font-size:11px;margin-top:12px;color:#80e5ed;animation:vbnBootPulse 1.2s ease-in-out infinite">ENTERING THE CITY...</span><div style="width:190px;height:3px;margin:20px auto;background:rgba(255,255,255,.15);overflow:hidden"><div style="width:45%;height:100%;background:linear-gradient(90deg,#ff4b9d,#77e6e7,#f6d66d);animation:vbnBootSweep 1.1s linear infinite"></div></div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
